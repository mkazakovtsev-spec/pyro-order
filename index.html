<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Форма заказа</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--accent:#111827;--line:#e5e7eb}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:96px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{max-width:980px;margin:auto;padding:14px 14px 10px}
h1{font-size:20px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted)}
.search{margin-top:10px;display:flex;gap:8px}.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.chips{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:13px;cursor:pointer}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:980px;margin:auto;padding:12px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px;box-shadow:0 1px 2px rgba(0,0,0,.02)}
.badge{font-size:11px;color:var(--muted);margin-bottom:5px}.name{font-size:15px;line-height:1.3;font-weight:650}
.meta{display:flex;justify-content:space-between;align-items:flex-end;margin-top:11px;gap:10px}.price{font-size:18px;font-weight:800}.unit{font-size:12px;color:var(--muted)}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.qty button{width:42px;height:40px;border:0;background:#f9fafb;font-size:22px;cursor:pointer}.qty input{width:52px;height:40px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:16px;font-weight:700}.qty input:focus{outline:none}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.bottom-inner{max-width:980px;margin:auto;display:flex;gap:10px;align-items:center}.summary{flex:1;min-width:0}.summary b{display:block;font-size:16px}.summary span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:white}.btn.secondary{background:#eef2f7;color:var(--text)}
.drawer{position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.34);display:none;align-items:flex-end}.drawer.open{display:flex}
.panel{background:#fff;width:100%;max-height:88vh;border-radius:20px 20px 0 0;padding:16px;overflow:auto}.panel-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:#fff;padding:8px 0 12px}
.panel h2{margin:0;font-size:20px}.close{border:0;background:#f3f4f6;border-radius:50%;width:36px;height:36px;font-size:20px}.cart-row{padding:12px 0;border-bottom:1px solid var(--line)}
.cart-row .r1{font-weight:650;font-size:14px}.cart-row .r2{display:flex;justify-content:space-between;margin-top:5px;font-size:13px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr;gap:8px;margin:14px 0}.form input,.form textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.empty{text-align:center;color:var(--muted);padding:32px 10px}.note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.panel{max-width:720px;margin:auto;border-radius:20px 20px 0 0}}
</style>
</head>
<body>
<header><div class="top"><h1>Форма заказа</h1><div class="sub">Каталог · 416 позиций · корзина сохраняется отдельно на этом устройстве</div>
<div class="search"><input id="search" type="search" placeholder="Поиск по названию товара…" autocomplete="off"></div><div id="chips" class="chips"></div></div></header>
<main><div class="toolbar"><span id="count"></span><button class="btn secondary" id="resetFilter">Сбросить фильтр</button></div><div id="grid" class="grid"></div></main>
<div class="bottom"><div class="bottom-inner"><div class="summary"><b id="sum">0 ₽</b><span id="items">Корзина пуста</span></div><button class="btn primary" id="openCart">Заказ для отправки</button></div></div>
<div class="drawer" id="drawer"><div class="panel"><div class="panel-head"><h2>Заказ для отправки</h2><button class="close" id="closeCart">×</button></div><div id="cart"></div>
<div class="form"><input id="customer" placeholder="ФИО / организация"><input id="phone" placeholder="Телефон"><textarea id="comment" rows="3" placeholder="Комментарий к заказу"></textarea></div>
<div class="actions"><button class="btn secondary" id="clearCart">Очистить</button><button class="btn primary" id="downloadExcel">Сформировать заказ</button></div>
<div class="note">Черновик сохраняется только в браузере этого устройства. На другом телефоне будет своя независимая корзина.</div></div></div>

function cats(){return ["Все",...Array.from(new Set(PRODUCTS.map(p=>p.category)))]}
function renderChips(){chips.innerHTML=cats().map(c=>`<button class="chip ${c===category?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");chips.querySelectorAll("button").forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderChips();renderProducts()})}
function filtered(){const q=query.trim().toLowerCase();return PRODUCTS.filter(p=>(category==="Все"||p.category===category)&&(!q||p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)))}
function renderProducts(){const list=filtered();count.textContent=`Показано: ${list.length}`;grid.innerHTML=list.map(p=>{const q=cart[p.id]||0;return `<div class="card"><div class="badge">${esc(p.category)}${p.caliber?` · ${esc(p.caliber)}`:""}</div><div class="name">${esc(p.name)}</div><div class="meta"><div><div class="price">${rub(p.price)}</div><div class="unit">за ${esc(p.unit)}</div></div><div class="qty"><button data-id="${p.id}" data-d="-1">−</button><input inputmode="numeric" min="0" value="${q}" data-input="${p.id}"><button data-id="${p.id}" data-d="1">+</button></div></div></div>`}).join("");
grid.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const id=b.dataset.id,d=+b.dataset.d;cart[id]=Math.max(0,(+cart[id]||0)+d);if(!cart[id])delete cart[id];save();renderProducts()});
grid.querySelectorAll("[data-input]").forEach(inp=>inp.onchange=()=>{const id=inp.dataset.input,v=Math.max(0,parseInt(inp.value)||0);if(v)cart[id]=v;else delete cart[id];save();renderProducts()})}
function selected(){return PRODUCTS.filter(p=>(cart[p.id]||0)>0).map(p=>({...p,qty:+cart[p.id],total:p.price*(+cart[p.id])}))}
function renderSummary(){const s=selected(),total=s.reduce((a,p)=>a+p.total,0),qty=s.reduce((a,p)=>a+p.qty,0);sum.textContent=rub(total);items.textContent=s.length?`${s.length} поз. · ${qty} ед.`:"Корзина пуста"}
function renderCart(){const s=selected();if(!s.length){cartEl.innerHTML='<div class="empty">В заказе пока ничего нет</div>';return}cartEl.innerHTML=s.map(p=>`<div class="cart-row"><div class="r1">${esc(p.name)}</div><div class="r2"><span>${p.qty} ${esc(p.unit)} × ${rub(p.price)}</span><b>${rub(p.total)}</b></div></div>`).join("")}
function xe(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function downloadExcel(){
  const s=selected();

  if(!s.length){
    alert("Корзина пуста");
    return;
  }

  saveInfo();

  const total=s.reduce((a,p)=>a+p.total,0);
  const now=new Date().toLocaleString("ru-RU");

  const csvRows=[
    ["ЗАКАЗ ДЛЯ ОТПРАВКИ"],
    ["Дата",now],
    ["Заказчик",info.customer||""],
    ["Телефон",info.phone||""],
    ["Комментарий",info.comment||""],
    [],
    ["Тип товара","Наименование","Ед.","Количество","Цена, ₽","Сумма, ₽"]
  ];

  s.forEach(p=>{
    csvRows.push([p.category,p.name,p.unit,p.qty,p.price,p.total]);
  });

  csvRows.push(["","","","","ИТОГО:",total]);

  const csv="\uFEFF"+csvRows.map(row=>
    row.map(value=>'"'+String(value??"").replace(/"/g,'""')+'"').join(";")
  ).join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);

  // Revoke previous generated file URL if any.
  if(window._orderDownloadUrl){
    try{ URL.revokeObjectURL(window._orderDownloadUrl); }catch(e){}
  }
  window._orderDownloadUrl=url;

  const orderRows=s.map((p,i)=>`
    <div class="cart-row">
      <div class="r1">${i+1}. ${esc(p.name)}</div>
      <div class="r2">
        <span>${esc(p.category)} · ${p.qty} ${esc(p.unit)} × ${rub(p.price)}</span>
        <b>${rub(p.total)}</b>
      </div>
    </div>
  `).join("");

  cartEl.innerHTML=`
    <div style="margin-bottom:12px">
      <div style="font-size:18px;font-weight:800;margin-bottom:8px">Готовый заказ</div>
      <div style="font-size:13px;line-height:1.5;color:#6b7280">
        <div><b>Дата:</b> ${esc(now)}</div>
        <div><b>Заказчик:</b> ${esc(info.customer||"—")}</div>
        <div><b>Телефон:</b> ${esc(info.phone||"—")}</div>
        <div><b>Комментарий:</b> ${esc(info.comment||"—")}</div>
      </div>
    </div>

    ${orderRows}

    <div style="font-size:18px;font-weight:800;text-align:right;padding:14px 0">
      Итого: ${rub(total)}
    </div>

    <a id="realDownloadLink"
       class="btn primary"
       href="${url}"
       download="Заказ_для_отправки.csv"
       style="display:block;text-align:center;text-decoration:none;margin-top:8px">
       Скачать CSV для Excel
    </a>

    <button id="printOrderBtn"
            class="btn secondary"
            style="width:100%;margin-top:8px">
       Печать / сохранить PDF
    </button>

    <div class="note" style="margin-top:10px">
      Это обычная ссылка на готовый файл. На Mac нажмите «Скачать CSV для Excel».
      На iPhone нажмите эту же кнопку; если файл откроется, используйте «Поделиться» → «Сохранить в Файлы».
    </div>
  `;

  const printBtn=document.getElementById("printOrderBtn");
  if(printBtn) printBtn.onclick=()=>window.print();

  // Hide input form/actions after forming order so user sees the result clearly.
  const formEl=document.querySelector(".panel .form");
  const actionsEl=document.querySelector(".panel .actions");
  if(formEl) formEl.style.display="none";
  if(actionsEl) actionsEl.style.display="none";
}
const search=document.getElementById("search"),chips=document.getElementById("chips"),grid=document.getElementById("grid"),count=document.getElementById("count"),sum=document.getElementById("sum"),items=document.getElementById("items"),drawer=document.getElementById("drawer"),cartEl=document.getElementById("cart"),customer=document.getElementById("customer"),phone=document.getElementById("phone"),comment=document.getElementById("comment");
search.oninput=()=>{query=search.value;renderProducts()};resetFilter.onclick=()=>{category="Все";query="";search.value="";renderChips();renderProducts()};openCart.onclick=()=>{
  const formEl=document.querySelector(".panel .form");
  const actionsEl=document.querySelector(".panel .actions");
  if(formEl) formEl.style.display="grid";
  if(actionsEl) actionsEl.style.display="grid";
  renderCart();
  drawer.classList.add("open");
};closeCart.onclick=()=>drawer.classList.remove("open");drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove("open")};clearCart.onclick=()=>{if(confirm("Очистить текущий заказ?")){cart={};save();renderProducts();renderCart()}};downloadExcel.onclick=downloadExcel;[customer,phone,comment].forEach(x=>x.oninput=saveInfo);customer.value=info.customer||"";phone.value=info.phone||"";comment.value=info.comment||"";renderChips();renderProducts();renderSummary();
</script></body></html>
